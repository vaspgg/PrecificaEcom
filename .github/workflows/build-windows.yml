name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install pillow
      - name: Gerar icone Windows
        run: python tools/generate_icon.py
      - name: Compilar PrecificaEcom.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PrecificaEcom
          --icon assets/PrecificaEcom.ico
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --collect-all webview
          --hidden-import clr
          desktop.py
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar instalador
        run: iscc installer/PrecificaEcom.iss
      - name: Publicar Setup
        uses: actions/upload-artifact@v4
        with:
          name: PrecificaEcom-Setup-v0.19
          path: installer/output/PrecificaEcom-Setup.exe
          if-no-files-found: error
