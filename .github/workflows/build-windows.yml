name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install pillow
      - name: Gerar icone Windows
        run: python tools/generate_icon.py
      - name: Compilar PrecificaEcom.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PrecificaEcom
          --icon assets/PrecificaEcom.ico
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --collect-all webview
          --hidden-import clr
          desktop.py
      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: PrecificaEcom-Windows-v0.10
          path: dist/PrecificaEcom.exe
          if-no-files-found: error
